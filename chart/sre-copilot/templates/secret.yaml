{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-copilot.fullname" . }}
  labels:
    {{- include "sre-copilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  llm-api-key: {{ .Values.secret.llmApiKey | quote }}
  slack-webhook-url: {{ .Values.secret.slackWebhookUrl | quote }}
{{- end }}
