apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-copilot.fullname" . }}
  labels:
    {{- include "sre-copilot.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sre-copilot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sre-copilot.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "sre-copilot.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "sre-copilot.fullname" . }}
          env:
            - name: SRE_COPILOT_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sre-copilot.secretName" . }}
                  key: llm-api-key
            - name: SRE_COPILOT_SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sre-copilot.secretName" . }}
                  key: slack-webhook-url
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: chroma
              mountPath: /app/.chroma
      volumes:
        - name: chroma
          {{- if .Values.persistence.chroma.enabled }}
          emptyDir:
            sizeLimit: {{ .Values.persistence.chroma.sizeLimit }}
          {{- else }}
          emptyDir: {}
          {{- end }}
