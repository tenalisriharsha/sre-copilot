[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-copilot"
version = "0.1.0"
description = "AI on-call assistant for Kubernetes incidents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "chromadb>=1.0",
]

[project.optional-dependencies]
# Only needed for SRE_COPILOT_EMBEDDING_BACKEND=sentence-transformers. It pulls
# in torch (several GB with CUDA wheels); the default "hash" backend does not.
embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "packaging>=24",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
