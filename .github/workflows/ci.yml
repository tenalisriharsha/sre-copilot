name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only torch wheels: sentence-transformers is a hard dependency and
      # the default CUDA wheels add gigabytes the tests never use.
      - run: pip install -e '.[dev]' --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
