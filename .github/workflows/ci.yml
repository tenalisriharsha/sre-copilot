name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # sentence-transformers (and torch) is the optional "embeddings" extra;
      # the tests use the offline hash embedder and never need it.
      # constraints.txt pins the whole tree for reproducible CI installs.
      - run: pip install -c constraints.txt -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
